<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG in Public Procurement in Albania</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .container {
        display: flex;
        min-height: 100vh;
        position: relative;
      }
      .panel {
        width: 300px;
        background: #f3f4f6;
        padding: 20px;
        border-right: 1px solid #e5e7eb;
        transition: transform 0.3s ease;
      }
      .panel.collapsed {
        transform: translateX(-100%);
      }
      .panel-toggle {
        position: absolute;
        left: 20px;
        top: 20px;
        padding: 8px 12px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        cursor: pointer;
        transition: transform 0.3s ease;
        z-index: 10;
      }
      .panel-toggle.panel-open {
        transform: translateX(300px);
      }
      .main-content {
        flex: 1;
        padding: 20px;
        padding-left: 60px;
      }
      select {
        width: 100%;
        padding: 8px;
        margin-top: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
      }
    </style>
    <script type="module">
      import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"
      Chatbot.init({
          chatflowid: "dac784bc-0b17-47f6-b263-9a2ec98ad1ad",
          apiHost: "https://dhgero-app.hf.space",
      })
    </script>
  </head>
  <body>
    <div class="container">
      <div id="panel" class="panel">
        <h2>Documents</h2>
        <select id="documentSelect">
          <option value="">Select a document</option>
          <option value="doc1">Document 1</option>
          <option value="doc2">Document 2</option>
          <option value="doc3">Document 3</option>
        </select>
      </div>
      <button id="panelToggle" class="panel-toggle panel-open">☰</button>
      <div class="main-content">
        <h1>RAG in Public Procurement in Albania</h1>
        <p>An AI-powered assistant for exploring public procurement documents</p>
      </div>
    </div>

    <script>
      const panel = document.getElementById('panel');
      const toggle = document.getElementById('panelToggle');
      
      toggle.addEventListener('click', () => {
        panel.classList.toggle('collapsed');
        toggle.classList.toggle('panel-open');
      });
    </script>
  </body>
</html>
