<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --text-light: #ffffffcc;
      --text-dark: #1e1e2f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-light);
      overflow: hidden;
      transition: background 0.6s ease, color 0.3s ease;
    }

    /* === Animated Background === */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: linear-gradient(-45deg, #1e1e2f, #2c2c3a, #3b3b4e, #1e1e2f);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      z-index: -1;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .chat-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2rem;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
      animation: slideFadeIn 1.2s ease-in-out;
      position: relative;
      z-index: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-weight: 600;
      color: var(--text-light);
      font-size: 1.75rem;
    }

    flowise-fullchatbot {
      width: 100%;
      display: block;
    }

    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
      z-index: 2;
    }

    a {
      color: #80ffe4;
      text-decoration: none;
      transition: color 0.3s;
    }

    a:hover {
      color: #c0fff5;
    }

    .toggle-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 0.4rem 0.75rem;
      border-radius: 12px;
      color: inherit;
      cursor: pointer;
      transition: background 0.3s ease;
      font-size: 0.85rem;
      z-index: 2;
    }

    .toggle-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @keyframes slideFadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Light theme */
    body.light {
      color: var(--text-dark);
    }

    body.light .chat-container {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.05);
      color: var(--text-dark);
    }

    body.light h1 {
      color: var(--text-dark);
    }

    body.light footer {
      color: #555;
    }

    body.light .toggle-btn {
      background: rgba(0, 0, 0, 0.08);
      color: var(--text-dark);
    }

    body.light .toggle-btn:hover {
      background: rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>

  <div class="animated-bg"></div>

  <div class="chat-container">
    <button class="toggle-btn" onclick="toggleTheme()">🌗 Theme</button>
    <h1>💬 AI Chat Assistant</h1>
    <flowise-fullchatbot></flowise-fullchatbot>
  </div>

  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"
    Chatbot.initFull({
      chatflowid: "ed94f24c-b110-454f-a2c3-ba48d13a38bc",
      apiHost: "https://flowise-dipi.onrender.com",
    })
  </script>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("light");
    }
  </script>

</body>
</html>
